name: Release Helm Charts

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ############################################################
      # 1. Read version + image tag
      ############################################################
      - name: Read chart version
        id: chart
        run: |
          VERSION=$(grep '^version:' joplin/Chart.yaml | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Read image tag (appVersion)
        id: image
        run: |
          TAG=$(yq '.image.tag' joplin/values.yaml)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      ############################################################
      # 2. Version bump logic from commit message
      ############################################################
      - name: Determine bump type
        id: bump
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "Commit: $MSG"

          if [[ $MSG == feat:* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif [[ $MSG == fix:* ]]; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=none" >> $GITHUB_OUTPUT
          fi

      ############################################################
      # 3. Calculate new version
      ############################################################
      - name: Calculate new version
        id: newv
        run: |
          OLD=${{ steps.chart.outputs.version }}
          TYPE=${{ steps.bump.outputs.type }}

          MAJOR=$(echo $OLD | cut -d. -f1)
          MINOR=$(echo $OLD | cut -d. -f2)
          PATCH=$(echo $OLD | cut -d. -f3)

          if [[ "$TYPE" == "minor" ]]; then
            MINOR=$((MINOR + 1)); PATCH=0
          elif [[ "$TYPE" == "patch" ]]; then
            PATCH=$((PATCH + 1))
          else
            echo "new=$OLD" >> $GITHUB_OUTPUT
            exit 0
          fi

          NEW="$MAJOR.$MINOR.$PATCH"
          echo "new=$NEW" >> $GITHUB_OUTPUT

      ############################################################
      # 4. Update Chart.yaml
      ############################################################
      - name: Update Chart.yaml
        if: steps.bump.outputs.type != 'none'
        run: |
          sed -i "s/^version:.*/version: ${{ steps.newv.outputs.new }}/" joplin/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.image.outputs.tag }}\"/" joplin/Chart.yaml

      ############################################################
      # 5. Package chart
      ############################################################
      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Package Helm Chart
        run: |
          helm dependency update joplin
          helm lint joplin
          helm package joplin  # creates joplin-<version>.tgz

      ############################################################
      # 6. Push chart & update index.yaml in gh-pages
      ############################################################
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update Helm repo index
        run: |
          mkdir -p gh-pages
          cp joplin-*.tgz gh-pages/

          helm repo index gh-pages --url https://tobiassackmann.github.io/helmcharts

      - name: Commit gh-pages updates
        run: |
          cd gh-pages
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Publish chart v${{ steps.newv.outputs.new }}" || echo "No changes"
          git push

      ############################################################
      # 7. Commit updated Chart.yaml to main + push tag
      ############################################################
      - name: Commit chart version bump to main
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add joplin/Chart.yaml
          git commit -m "release: v${{ steps.newv.outputs.new }}" || echo "No changes"
          git tag "v${{ steps.newv.outputs.new }}"
          git push --follow-tags

      ############################################################
      # 8. Create GitHub release with chart artifact
      ############################################################
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.bump.outputs.type != 'none'
        with:
          tag_name: v${{ steps.newv.outputs.new }}
          name: v${{ steps.newv.outputs.new }}
          files: joplin-*.tgz
