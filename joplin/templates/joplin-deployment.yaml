apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "joplin.fullname" . }}
  labels:
    {{- include "joplin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "joplin.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "joplin.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: joplin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 22300
          env:
{{- range $key, $value := .Values.env }}
            - name: {{ $key }}
{{- if and (kindIs "map" $value) (hasKey $value "valueFrom") }}
              valueFrom:
                secretKeyRef:
                  name: {{ tpl $value.valueFrom.secretKeyRef.name $ }}
                  key: {{ $value.valueFrom.secretKeyRef.key }}
{{- else }}
              value: "{{ $value }}"
{{- end }}
{{- end }}

          # POSTGRES_PASSWORD fallback — resolve the secret generated by the Postgres chart.
{{- $pg := .Values.postgresql }}
{{- $secretName := printf "%s-postgresql" .Release.Name }}
{{- if $pg.fullnameOverride }}
  {{- $secretName = $pg.fullnameOverride }}
{{- end }}
{{- $secretObj := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $pwKey := "password" }}
{{- if $secretObj }}
  {{- if (index $secretObj.data "password") }}
    {{- $pwKey = "password" }}
  {{- else if (index $secretObj.data "postgres-password") }}
    {{- $pwKey = "postgres-password" }}
  {{- else if (index $secretObj.data "postgresql-password") }}
    {{- $pwKey = "postgresql-password" }}
  {{- end }}
{{- end }}

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $pwKey }}

          volumeMounts:
            - name: joplin-data
              mountPath: /home/joplin/data

      volumes:
        - name: joplin-data
          persistentVolumeClaim:
            claimName: "{{ include "joplin.fullname" . }}-data"
