replicaCount: 1

image:
  repository: joplin/server
  tag: latest
  pullPolicy: IfNotPresent

env:
  APP_PORT: "22300"
  APP_BASE_URL: "https://joplin.my-domain.de"
  DB_CLIENT: "pg"
  POSTGRES_DATABASE: "joplin"
  POSTGRES_USER: "joplin"
  POSTGRES_PORT: "5432"
  POSTGRES_HOST: joplin-postgresql
  # NOTE: we do NOT set POSTGRES_PASSWORD here, we use the secret produced by the PostgreSQL chart.

service:
  type: ClusterIP
  port: 22300

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: joplin.my-domain.de
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: joplin-tls
      hosts:
        - joplin.my-domain.de

persistence:
  enabled: true
  size: 1Gi
  accessModes:
    - ReadWriteOnce

postgresql:
  enabled: true
  fullnameOverride: joplin-postgresql

  auth:
    database: joplin
    username: joplin
    # We intentionally do NOT set password here (Option B). Bitnami chart will create a secret and a password.
    # If you prefer a fixed password later, you can add:
    # password: "mysecret"
    # or existingSecret: my-secret

  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.6.0-debian-12-r4
    pullPolicy: IfNotPresent

  primary:
    persistence:
      enabled: true
      size: 8Gi

  global:
    imageRegistry: ""
    imagePullSecrets: []
    security:
      allowInsecureImages: true
